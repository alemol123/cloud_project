<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Customer View - Cloud Food Delivery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Arial; max-width: 900px; margin: 0 auto; padding: 20px; background: #f4f4f8; }
    .card { background: white; padding: 20px; border-radius: 14px; margin-bottom: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
    button { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    button:hover { background: #1e4fcf; }
    input, select { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc; }
    .error { color: #b91c1c; }
    .ok { color: #15803d; }
    .meal-item { padding: 8px 0; border-bottom: 1px dashed #ccc; }
  </style>
</head>
<body>

<h1>Customer View</h1>
<nav><a href="index.html">Home</a> | <a href="restaurant.html">Restaurant View</a></nav>

<div class="card">
  <h2>Select delivery area</h2>
  <select id="areaSelect">
    <option value="">-- Select an area --</option>
    <option value="Central">Central</option>
    <option value="North">North</option>
    <option value="South">South</option>
  </select>
  <button id="loadMealsBtn">Load meals</button>
  <div id="loadStatus"></div>
</div>

<div class="card">
  <h2>Available meals</h2>
  <div id="mealsContainer"></div>
</div>

<div class="card">
  <h2>Your details</h2>
  <input id="customerName" placeholder="Your name" />
  <input id="customerAddress" placeholder="Your address" />
  <button id="placeOrderBtn">Place order</button>
  <div id="orderStatus"></div>
</div>

<div class="card" id="confirmationCard" style="display:none;">
  <h2>Order confirmation</h2>
  <div id="orderSummary"></div>
</div>

<script>
  const MEALS_API_URL = "https://food-functions-g2-excmeddydee6ame4.westeurope-01.azurewebsites.net/api/HTTPGetMealsByArea";
  const ORDER_API_URL = "https://food-functions-g2-excmeddydee6ame4.westeurope-01.azurewebsites.net/api/HTTPSubmitOrder";

  const areaSelect = document.getElementById("areaSelect");
  const loadMealsBtn = document.getElementById("loadMealsBtn");
  const mealsContainer = document.getElementById("mealsContainer");
  const loadStatus = document.getElementById("loadStatus");

  const placeOrderBtn = document.getElementById("placeOrderBtn");
  const orderStatus = document.getElementById("orderStatus");
  const confirmationCard = document.getElementById("confirmationCard");
  const orderSummary = document.getElementById("orderSummary");

  function setStatus(el, msg, type) {
    el.textContent = msg;
    el.className = type;
  }

  async function loadMeals() {
    const area = areaSelect.value;
    if (!area) return setStatus(loadStatus, "Please select an area.", "error");

    setStatus(loadStatus, "Loading meals...", "ok");

    try {
      const res = await fetch(`${MEALS_API_URL}?area=${area}`);
      if (!res.ok) throw new Error(await res.text());

      const meals = await res.json();

      mealsContainer.innerHTML = meals.map(m => `
        <div class="meal-item">
          <label>
            <input type="checkbox" class="meal-checkbox"
                   data-name="${m.Name}"
                   data-price="${m.Price}"
                   data-prep="${m.EstimatedPrepTime}">
            <strong>${m.Name}</strong> – €${m.Price}
          </label><br>
          <small>${m.Description || ""}</small>
        </div>
      `).join("");

      setStatus(loadStatus, "Meals loaded.", "ok");

    } catch (err) {
      console.error(err);
      setStatus(loadStatus, "Failed to load meals.", "error");
    }
  }

  async function placeOrder() {
    const name = document.getElementById("customerName").value.trim();
    const address = document.getElementById("customerAddress").value.trim();
    const area = areaSelect.value;

    if (!name || !address) return setStatus(orderStatus, "Please fill in your details.", "error");

    const items = [...document.querySelectorAll(".meal-checkbox:checked")].map(cb => ({
      name: cb.dataset.name,
      price: Number(cb.dataset.price),
      prepTime: Number(cb.dataset.prep)
    }));

    if (items.length === 0) return setStatus(orderStatus, "Select at least one meal.", "error");

    const totalCost = items.reduce((a, b) => a + b.price, 0);
    const totalPrep = items.reduce((a, b) => a + b.prepTime, 0);
    const estimatedTime = totalPrep + 25;

    const payload = { customerName: name, customerAddress: address, deliveryArea: area, items, totalCost, estimatedDeliveryTime: estimatedTime };

    try {
      const res = await fetch(ORDER_API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!res.ok) throw new Error(await res.text());

      setStatus(orderStatus, "Order placed!", "ok");
      confirmationCard.style.display = "block";
      orderSummary.innerHTML = `
        <p>Total cost: €${totalCost}</p>
        <p>Estimated time: ${estimatedTime} min</p>
      `;

    } catch (err) {
      console.error(err);
      setStatus(orderStatus, "Order failed.", "error");
    }
  }

  loadMealsBtn.addEventListener("click", loadMeals);
  placeOrderBtn.addEventListener("click", placeOrder);
</script>

</body>
</html>
