<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Customer View</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 40px 16px;
      display: flex;
      justify-content: center;
    }
    .page {
      width: 100%;
      max-width: 1000px;
    }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .nav h1 {
      margin: 0;
      font-size: 28px;
    }
    .nav a {
      color: #2563eb;
      text-decoration: none;
      margin-left: 12px;
      font-size: 14px;
    }
    .nav a:hover {
      text-decoration: underline;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px 22px 28px;
      box-shadow: 0 10px 35px rgba(15, 23, 42, 0.12);
      margin-bottom: 18px;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 20px;
    }
    label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }
    select, input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #d4d4d8;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    select:focus, input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.12);
    }
    button {
      border: none;
      border-radius: 999px;
      background: #2563eb;
      color: white;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .status {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }
    .status.error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
    .status.success {
      background: #ecfdf3;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .meals-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    .meal {
      border-radius: 12px;
      border: 1px solid #e4e4e7;
      padding: 10px 12px;
      background: #fafafa;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .meal h3 {
      margin: 0 0 4px;
      font-size: 15px;
    }
    .meal small {
      display: block;
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
    }
    .meal p {
      margin: 0;
      font-size: 13px;
      color: #4b5563;
    }
    .summary {
      margin-top: 12px;
      font-size: 14px;
      color: #111827;
    }
    .summary strong {
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="nav">
      <h1>Customer View</h1>
      <div>
        <a href="index.html">Home</a>
        <a href="restaurant.html">Restaurant View</a>
      </div>
    </div>

    <div class="card">
      <h2>Select delivery area</h2>
      <label for="deliveryArea">Delivery area</label>
      <select id="deliveryArea">
        <option value="Central">Central</option>
        <option value="North">North</option>
        <option value="South">South</option>
      </select>
      <button id="loadMealsBtn">Load meals</button>
      <div id="loadStatus" class="status"></div>
    </div>

    <div class="card">
      <h2>Available meals</h2>
      <div id="mealsList" class="meals-list"></div>
      <div id="selectionSummary" class="summary"></div>
    </div>

    <div class="card">
      <h2>Your details</h2>
      <label for="customerName">Name:</label>
      <input id="customerName" type="text" placeholder="Your name" />

      <label for="customerAddress">Address:</label>
      <input id="customerAddress" type="text" placeholder="Your address" />

      <button id="placeOrderBtn">Place order</button>
      <div id="orderStatus" class="status"></div>
    </div>
  </div>

  <script>
    // 🔴 MUY IMPORTANTE:
    // Sustituye estos dos strings por los URLs COMPLETOS de "Get function URL"
    // 1) HTTPGetMealsByArea
    // 2) HTTPSubmitOrder
    const GET_MEALS_URL   = "https://food-functions-g2-excmeddydee6ame4.westeurope-01.azurewebsites.net/api/meals";
    const SUBMIT_ORDER_URL = "https://food-functions-g2-excmeddydee6ame4.westeurope-01.azurewebsites.net/api/submitOrder";

    const deliveryAreaSelect = document.getElementById("deliveryArea");
    const loadMealsBtn = document.getElementById("loadMealsBtn");
    const mealsListEl = document.getElementById("mealsList");
    const loadStatusEl = document.getElementById("loadStatus");
    const selectionSummaryEl = document.getElementById("selectionSummary");

    const placeOrderBtn = document.getElementById("placeOrderBtn");
    const orderStatusEl = document.getElementById("orderStatus");

    let currentMeals = [];

    function showStatus(el, message, type) {
      el.textContent = message;
      el.className = "status " + type;
      el.style.display = "block";
    }

    function clearStatus(el) {
      el.style.display = "none";
      el.textContent = "";
    }

    function normalizeMeals(data) {
      if (Array.isArray(data)) return data;
      if (Array.isArray(data.meals)) return data.meals;
      if (Array.isArray(data.value)) return data.value;
      return [];
    }

    function buildUrlWithParams(baseUrl, params) {
      const url = new URL(baseUrl);
      Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
      return url.toString();
    }

    async function loadMeals() {
      clearStatus(loadStatusEl);
      mealsListEl.innerHTML = "";
      selectionSummaryEl.textContent = "";
      currentMeals = [];

      const area = deliveryAreaSelect.value;

      try {
        loadMealsBtn.disabled = true;
        const url = buildUrlWithParams(GET_MEALS_URL, { area });

        const response = await fetch(url);
        let data = {};
        try { data = await response.json(); } catch {}

        if (!response.ok) {
          const msg = data.message || JSON.stringify(data) || "Unknown error";
          showStatus(loadStatusEl, "Failed to load meals: " + msg, "error");
          return;
        }

        const meals = normalizeMeals(data);
        currentMeals = meals;

        if (!meals.length) {
          mealsListEl.innerHTML = "<p>No meals found for this area yet.</p>";
          return;
        }

        mealsListEl.innerHTML = "";
        meals.forEach((meal, index) => {
          const restaurantName = meal.restaurantName || meal.RestaurantName || meal.restaurant || "Restaurant";
          const dishName = meal.dishName || meal.DishName || meal.name || "Dish";
          const description = meal.description || meal.Description || "";
          const prepTime =
            meal.prepTimeMinutes ||
            meal.prep_time_minutes ||
            meal.prepTime ||
            0;
          const price = meal.price ?? meal.Price ?? 0;

          const wrapper = document.createElement("label");
          wrapper.className = "meal";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.dataset.index = String(index);
          checkbox.style.marginTop = "4px";

          const content = document.createElement("div");
          const title = document.createElement("h3");
          title.textContent = dishName + " – $" + price;
          const meta = document.createElement("small");
          meta.textContent =
            restaurantName + (prepTime ? " · " + prepTime + " min prep" : "");
          const desc = document.createElement("p");
          desc.textContent = description;

          content.appendChild(title);
          content.appendChild(meta);
          content.appendChild(desc);

          wrapper.appendChild(checkbox);
          wrapper.appendChild(content);

          mealsListEl.appendChild(wrapper);
        });

        showStatus(loadStatusEl, "Meals loaded for area: " + area, "success");
      } catch (err) {
        console.error(err);
        showStatus(
          loadStatusEl,
          "Network error loading meals. Check Function logs.",
          "error"
        );
      } finally {
        loadMealsBtn.disabled = false;
      }
    }

    function getSelectedMeals() {
      const checkboxes = mealsListEl.querySelectorAll('input[type="checkbox"]');
      const selected = [];
      checkboxes.forEach((cb) => {
        if (cb.checked) {
          const idx = parseInt(cb.dataset.index, 10);
          if (!isNaN(idx) && currentMeals[idx]) {
            selected.push(currentMeals[idx]);
          }
        }
      });
      return selected;
    }

    function updateSelectionSummary() {
      const selected = getSelectedMeals();
      if (!selected.length) {
        selectionSummaryEl.textContent = "";
        return { totalPrice: 0, estimatedTime: 0 };
      }

      let totalPrice = 0;
      let totalPrep = 0;
      selected.forEach((meal) => {
        const price = Number(meal.price ?? meal.Price ?? 0);
        const prep =
          Number(
            meal.prepTimeMinutes ||
              meal.prep_time_minutes ||
              meal.prepTime ||
              0
          ) || 0;
        totalPrice += price;
        totalPrep += prep;
      });

      const fixedPickup = 10;
      const fixedDelivery = 20;
      const estimatedTime = totalPrep + fixedPickup + fixedDelivery;

      selectionSummaryEl.innerHTML =
        "Selected " +
        selected.length +
        " meal(s). Total: <strong>$" +
        totalPrice.toFixed(2) +
        "</strong>. Estimated delivery time: <strong>" +
        estimatedTime +
        " minutes</strong>.";

      return { totalPrice, estimatedTime };
    }

    mealsListEl.addEventListener("change", updateSelectionSummary);

    async function submitOrder() {
      clearStatus(orderStatusEl);

      const name = document.getElementById("customerName").value.trim();
      const address = document.getElementById("customerAddress").value.trim();
      const area = deliveryAreaSelect.value;
      const selected = getSelectedMeals();

      if (!name || !address) {
        showStatus(orderStatusEl, "Please enter your name and address.", "error");
        return;
      }
      if (!selected.length) {
        showStatus(orderStatusEl, "Please select at least one meal.", "error");
        return;
      }

      const summary = updateSelectionSummary();
      const totalCost = summary.totalPrice;
      const estimatedTimeMinutes = summary.estimatedTime;

      // 👇 IMPORTANTE: el backend pide `selectedMeals`
      const selectedMeals = selected.map((meal) => ({
        restaurantName:
          meal.restaurantName || meal.RestaurantName || meal.restaurant,
        dishName: meal.dishName || meal.DishName || meal.name,
        price: Number(meal.price ?? meal.Price ?? 0),
        prepTimeMinutes:
          Number(
            meal.prepTimeMinutes ||
              meal.prep_time_minutes ||
              meal.prepTime ||
              0
          ) || 0
      }));

      const payload = {
        customerName: name,
        customerAddress: address,
        area,
        selectedMeals,            // 👈 nombre exacto que pide tu función
        totalCost,
        estimatedTimeMinutes
      };

      try {
        placeOrderBtn.disabled = true;
        const response = await fetch(SUBMIT_ORDER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        let data = {};
        try { data = await response.json(); } catch {}

        if (!response.ok) {
          const msg = data.message || JSON.stringify(data) || "Unknown error";
          showStatus(orderStatusEl, "Error placing order: " + msg, "error");
        } else {
          showStatus(
            orderStatusEl,
            "Order placed! 🎉 Total $" +
              totalCost.toFixed(2) +
              ", ETA " +
              estimatedTimeMinutes +
              " minutes.",
            "success"
          );
        }
      } catch (err) {
        console.error(err);
        showStatus(
          orderStatusEl,
          "Network error placing order. Check Function logs.",
          "error"
        );
      } finally {
        placeOrderBtn.disabled = false;
      }
    }

    loadMealsBtn.addEventListener("click", loadMeals);
    placeOrderBtn.addEventListener("click", submitOrder);

    // Cargar comidas al entrar
    loadMeals();
  </script>
</body>
</html>
