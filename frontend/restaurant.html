<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Portal - Register Meal</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 20px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { background-color: #4CAF50; color: white; padding: 10px 15px; border: none; cursor: pointer; margin-top: 20px; }
        .message { margin-top: 20px; padding: 10px; border: 1px solid #ccc; background-color: #f9f9f9; display: none; }
    </style>
</head>
<body>
    <header>
        <h2>🍴 Restaurant Meal Registration</h2>
        <p><a href="customer.html">Switch to Customer View</a></p>
    </header>

    <form id="mealRegistrationForm">
        <label for="dishName">Dish Name:</label>
        <input type="text" id="dishName" name="dishName" required>

        <label for="description">Description:</label>
        <textarea id="description" name="description" rows="3" required></textarea>

        <label for="prepTime">Preparation Time (minutes):</label>
        <input type="number" id="prepTime" name="prepTime" min="5" required>

        <label for="price">Price ($):</label>
        <input type="number" id="price" name="price" step="0.01" min="0.01" required>

        <label for="area">Delivery Area:</label>
        <select id="area" name="area" required>
            <option value="">-- Select Area --</option>
            <option value="Central">Central</option>
            <option value="North">North</option>
            <option value="South">South</option>
        </select>

        <button type="submit">Register Meal</button>
    </form>

    <div id="message" class="message"></div>

    <script>
        // *** IMPORTANT: REPLACE WITH YOUR AZURE FUNCTION URL ***
        const AZURE_FUNCTION_URL_REGISTER = "YOUR_AZURE_FUNCTION_HTTP_TRIGGER_URL_FOR_REGISTERING_MEALS";

        document.getElementById('mealRegistrationForm').addEventListener('submit', function(event) {
            event.preventDefault();
            registerMeal();
        });

        async function registerMeal() {
            const form = document.getElementById('mealRegistrationForm');
            const messageDiv = document.getElementById('message');
            messageDiv.style.display = 'none';

            const mealData = {
                dishName: form.dishName.value,
                description: form.description.value,
                prepTime: parseInt(form.prepTime.value),
                price: parseFloat(form.price.value),
                deliveryArea: form.area.value
            };

            try {
                const response = await fetch(AZURE_FUNCTION_URL_REGISTER, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(mealData)
                });

                if (response.ok) {
                    messageDiv.textContent = `✅ Success! Meal "${mealData.dishName}" registered.`;
                    messageDiv.style.backgroundColor = '#d4edda'; // Light green for success
                    form.reset();
                } else {
                    const errorText = await response.text();
                    messageDiv.textContent = `❌ Error registering meal: ${response.status} - ${errorText}`;
                    messageDiv.style.backgroundColor = '#f8d7da'; // Light red for error
                }
            } catch (error) {
                // This catches network errors or CORS issues
                console.error('Network or CORS error:', error);
                messageDiv.textContent = `⚠️ Network Error: Could not reach the server. Check your Azure Function URL and CORS settings.`;
                messageDiv.style.backgroundColor = '#fff3cd'; // Light yellow for warning
            }
            messageDiv.style.display = 'block';
        }
    </script>
</body>
</html>
