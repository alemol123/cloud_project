<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Restaurant – Cloud Food Delivery</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Restaurant View</h1>
  <nav>
    <a href="index.html">Home</a> |
    <a href="customer.html">Customer View</a>
  </nav>

  <form id="meal-form">
    <label>Restaurant name: <input id="restaurant-name" required /></label><br />
    <label>Dish name: <input id="dish-name" required /></label><br />
    <label>Description:<br />
      <textarea id="dish-description" required></textarea>
    </label><br />
    <label>Prep time (min): <input id="prep-time" type="number" min="1" required /></label><br />
    <label>Price: <input id="price" type="number" min="0" step="0.01" required /></label><br />
    <label>Delivery area:
      <select id="delivery-area" required>
        <option value="">-- choose an area --</option>
        <option value="Central">Central</option>
        <option value="North">North</option>
        <option value="South">South</option>
      </select>
    </label><br />
    <label>Image URL (optional): <input id="image-url" /></label><br />
    <button type="submit">Register meal</button>
  </form>

  <p id="restaurant-message"></p>

  <script src="app.js"></script>
</body>
</html>
